<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .optional { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="62" class="title">Enterprise RAG Architecture</text>
  <text x="60" y="90" class="subtitle">DeepSeek + SiliconFlow BGE-M3 + Qdrant + Hybrid Retrieval + LangGraph + optional Langfuse</text>
  <rect x="60" y="145" width="190" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="187" text-anchor="middle" class="box-title">User</text>
  <text x="155" y="216" text-anchor="middle" class="box-text">Upload document</text>
  <text x="155" y="238" text-anchor="middle" class="box-text">Ask a question</text>
  <rect x="330" y="135" width="230" height="125" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="445" y="177" text-anchor="middle" class="box-title">Streamlit UI</text>
  <text x="445" y="207" text-anchor="middle" class="box-text">Document ingestion</text>
  <text x="445" y="229" text-anchor="middle" class="box-text">Q&amp;A and source display</text>
  <rect x="640" y="125" width="250" height="145" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="765" y="166" text-anchor="middle" class="box-title">LangGraph Workflow</text>
  <text x="765" y="197" text-anchor="middle" class="box-text">Retrieve → Grade → Generate</text>
  <text x="765" y="222" text-anchor="middle" class="box-text">Query transform fallback</text>
  <text x="765" y="247" text-anchor="middle" class="small">Corrective RAG state graph</text>
  <rect x="970" y="125" width="170" height="105" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1055" y="166" text-anchor="middle" class="box-title">DeepSeek</text>
  <text x="1055" y="197" text-anchor="middle" class="box-text">deepseek-chat</text>
  <rect x="330" y="340" width="230" height="125" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="445" y="381" text-anchor="middle" class="box-title">SiliconFlow</text>
  <text x="445" y="411" text-anchor="middle" class="box-text">BAAI/bge-m3</text>
  <text x="445" y="434" text-anchor="middle" class="small">1024-dim embeddings</text>
  <rect x="640" y="340" width="250" height="125" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="765" y="381" text-anchor="middle" class="box-title">Qdrant</text>
  <text x="765" y="411" text-anchor="middle" class="box-text">Vector storage + workspace filter</text>
  <text x="765" y="434" text-anchor="middle" class="small">local Docker service</text>
  <rect x="970" y="340" width="170" height="125" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2" class="optional"/>
  <text x="1055" y="381" text-anchor="middle" class="box-title">Reranker</text>
  <text x="1055" y="411" text-anchor="middle" class="box-text">bge-reranker-v2-m3</text>
  <text x="1055" y="438" text-anchor="middle" class="small">optional / default off</text>
  <path d="M250 197 H330" class="arrow"/>
  <path d="M560 197 H640" class="arrow"/>
  <path d="M890 180 H970" class="arrow"/>
  <path d="M765 270 V340" class="arrow"/>
  <path d="M640 402 H560" class="arrow"/>
  <path d="M560 402 H640" class="arrow"/>
  <path d="M890 402 H970" class="arrow"/>
  <path d="M765 465 V540" class="arrow"/>
  <path d="M765 540 H445 V270" class="arrow"/>
  <rect x="330" y="555" width="810" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="365" y="590" class="box-title">Request flow</text>
  <text x="365" y="620" class="box-text">Question → Qdrant retrieval → optional rerank → DeepSeek grounded answer → UI sources with document and page labels.</text>
  <text x="365" y="644" class="small">Source project: Shubhamsaboo/awesome-llm-apps · Corrective RAG · Apache-2.0</text>
</svg>
